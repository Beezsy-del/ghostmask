<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Inquiries - Contact Us</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
    input, textarea { width: 100%; max-width: 400px; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>Customer Inquiries</h1>
  <p>Please provide your contact information to submit a support request.</p>
  <form id="contact-form">
    <div class="form-group">
      <label for="contact-name">Full Name</label>
      <input type="text" id="contact-name" name="full_name" value="Alex Mercer" required>
    </div>
    <div class="form-group">
      <label for="contact-email">Email Address</label>
      <input type="email" id="contact-email" name="email" value="alex.mercer@example.test" required>
    </div>
    <div class="form-group">
      <label for="contact-phone">Phone Number</label>
      <input type="tel" id="contact-phone" name="phone" value="555-0143">
    </div>
    <div class="form-group">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="4">Please provide assistance with our staging service subscription.</textarea>
    </div>
    <button type="submit" id="submit-btn">Send Inquiry</button>
  </form>
</body>
</html>
